<!-- 상도와 마크 할 사람을 정하는 홈과 뽑기 화면을 담은 단일 웹페이지 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152416">
  <title>상도랑 마크 할 사람</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; overflow: hidden; background: #132014; color: #fffef0; font-family: ui-monospace, "Cascadia Code", "Courier New", monospace; }
    button { font: inherit; }
    .page { position: fixed; inset: 0; display: none; min-height: 100svh; }
    .page.active { display: grid; }

    .home { place-items: center; isolation: isolate; background: #162b17 url("background.jpg") center / cover no-repeat; }
    .home::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(5, 12, 6, .76), rgba(5, 12, 6, .08) 48%, rgba(5, 12, 6, .44)), linear-gradient(0deg, rgba(8, 15, 8, .68), transparent 45%); }
    .home-content { position: relative; width: min(94vw, 900px); min-height: min(640px, 100svh); padding: clamp(28px, 6vw, 66px) clamp(18px, 5vw, 64px); display: flex; flex-direction: column; justify-content: center; z-index: 1; }
    .title-line { display: flex; align-items: center; gap: clamp(8px, 2vw, 24px); margin-bottom: 15px; font-weight: 1000; font-size: clamp(27px, 7vw, 65px); letter-spacing: -4px; line-height: .9; text-shadow: 4px 4px 0 #091009, 7px 7px 0 rgba(0, 0, 0, .45); }
    .title-line span { white-space: nowrap; }
    .minecraft-word { font-size: clamp(28px, 8vw, 76px); letter-spacing: -6px; color: #e5e4db; -webkit-text-stroke: 3px #171915; text-shadow: 4px 4px #050605, 7px 7px 0 rgba(0, 0, 0, .45); transform: rotate(-3deg); }
    .home-copy { width: min(380px, 62vw); margin: 0 0 28px; color: #d5e9bd; font-size: clamp(13px, 2vw, 16px); line-height: 1.65; font-weight: 700; text-shadow: 2px 2px #111; }
    .start { width: min(300px, 65vw); min-height: 62px; border: 4px solid #d9ef8a; outline: 4px solid #263719; color: #fffef0; font-size: clamp(20px, 4vw, 26px); font-weight: 1000; letter-spacing: 2px; cursor: pointer; background: repeating-linear-gradient(90deg, #5d9336 0 22px, #70aa40 22px 44px); box-shadow: 8px 8px 0 #101810, inset 0 5px #b2d76e, inset 0 -7px #365821; transition: transform .08s, box-shadow .08s; }
    .start:active { transform: translate(5px, 5px); box-shadow: 3px 3px 0 #101810, inset 0 3px #b2d76e, inset 0 -4px #365821; }
    .dd { position: absolute; right: max(-15px, 2vw); bottom: -8px; width: min(47vw, 430px); max-height: 78svh; object-fit: contain; object-position: bottom right; filter: drop-shadow(-6px 8px 0 rgba(6, 11, 6, .65)); pointer-events: none; z-index: -1; }
    .home-tag { position: absolute; bottom: 20px; left: clamp(18px, 5vw, 64px); margin: 0; color: #d6edb5; font-size: 11px; font-weight: 700; text-shadow: 2px 2px #101810; }

    .picker { place-items: center; padding: 24px 18px; background: #162717; background-image: radial-gradient(circle at 16% 18%, #314a25 0 2px, transparent 3px), radial-gradient(circle at 85% 78%, #243b22 0 3px, transparent 4px), linear-gradient(#263d25 0 43%, #162717 43%); }
    .picker-wrap { width: min(92vw, 520px); text-align: center; }
    .picker-title { margin: 0; font-size: clamp(24px, 7vw, 40px); letter-spacing: -2px; line-height: 1.08; text-shadow: 3px 3px 0 #0d160d; }
    .picker-subtitle { margin: 11px 0 27px; color: #b8cb9c; font-size: 13px; letter-spacing: 1px; }
    .machine { position: relative; padding: clamp(29px, 8vw, 43px) clamp(16px, 5vw, 32px) 30px; background-color: #777c75; background-image: linear-gradient(135deg, transparent 0 42%, rgba(255,255,255,.14) 42% 50%, transparent 50%), linear-gradient(45deg, transparent 0 42%, rgba(0,0,0,.18) 42% 50%, transparent 50%), repeating-linear-gradient(90deg, rgba(40,48,39,.35) 0 3px, transparent 3px 30px), repeating-linear-gradient(0deg, rgba(40,48,39,.35) 0 3px, transparent 3px 30px); background-size: 30px 30px; border: 6px solid #9ba094; outline: 6px solid #31372f; box-shadow: 11px 11px 0 #0b120b, inset 0 0 0 5px #565d54; }
    .machine::before, .machine::after { content: ""; position: absolute; width: 22px; height: 22px; background: #4d9f99; border: 3px solid #b9eee2; box-shadow: inset -5px -5px #1e6260, 2px 2px #25352d; }
    .machine::before { top: 9px; left: 9px; } .machine::after { right: 9px; bottom: 9px; }
    .screen { min-height: 148px; display: grid; place-items: center; padding: 18px 12px; background-color: #555c54; background-image: radial-gradient(circle at 22% 28%, #8ea1a0 0 3px, transparent 4px), radial-gradient(circle at 75% 63%, #333a34 0 4px, transparent 5px), linear-gradient(135deg, rgba(255,255,255,.13) 25%, transparent 25%) 0 0 / 20px 20px; border: 6px solid #242923; outline: 4px solid #b2b7aa; box-shadow: inset 0 0 0 4px #3c443d, inset 0 0 22px #121812; }
    .idle, .result { margin: 0; font-weight: 1000; text-wrap: balance; }
    .idle { color: #a9c37d; font-size: clamp(20px, 6vw, 31px); line-height: 1.35; letter-spacing: 4px; }
    .result { display: none; font-size: clamp(23px, 7vw, 35px); line-height: 1.15; text-shadow: 3px 3px 0 #253c1d; }
    .screen.show-result .idle { display: none; } .screen.show-result .result { display: block; }
    .screen.rolling .idle { animation: flicker .1s steps(2) infinite; }
    @keyframes flicker { 50% { opacity: .2; transform: translateY(2px); } }
    .pick { width: 100%; margin-top: 26px; min-height: 64px; border: 5px solid #a9b1a1; outline: 4px solid #252b24; background-color: #697167; background-image: linear-gradient(135deg, rgba(255,255,255,.15) 25%, transparent 25%) 0 0 / 18px 18px, linear-gradient(315deg, rgba(0,0,0,.18) 25%, transparent 25%) 0 0 / 18px 18px; color: #fffde7; font-size: clamp(20px, 5vw, 25px); font-weight: 1000; letter-spacing: 2px; cursor: pointer; box-shadow: 7px 7px 0 #17200f, inset 0 5px #d9decb, inset 0 -7px #3a4239; transition: transform .08s, box-shadow .08s; }
    .pick:active { transform: translate(5px, 5px); box-shadow: 2px 2px 0 #17200f, inset 0 3px #d9decb, inset 0 -4px #3a4239; }
    .pick:disabled { cursor: wait; filter: saturate(.6); }
    .hint { min-height: 20px; margin: 19px 0 0; color: #a6ba87; font-size: 12px; letter-spacing: .4px; }
    .home-button { margin-top: 22px; padding: 5px 10px; border: 0; background: transparent; color: #a6ba87; font-size: 12px; text-decoration: underline; cursor: pointer; }
    @media (max-width: 540px) { .home-content { justify-content: flex-start; padding-top: 14svh; } .title-line { display: grid; grid-template-columns: 1fr auto 1fr; gap: 3px; text-align: center; letter-spacing: -3px; } .minecraft-word { font-size: clamp(25px, 8vw, 43px); letter-spacing: -4px; -webkit-text-stroke-width: 2px; } .dd { width: 68vw; right: -8vw; bottom: -18px; max-height: 61svh; } .home-copy { width: 54vw; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page home active" id="home">
    <section class="home-content" aria-label="홈">
      <div class="title-line" aria-label="상도랑 마인크래프트 할 사람"><span>상도랑</span><strong class="minecraft-word">MINECRAFT</strong><span>할 사람</span></div>
      <p class="home-copy">오늘 함께 블록을 쌓을 단 한 사람.<br>운명에 맡겨보세요.</p>
      <button class="start" id="start" type="button">시작하기</button>
      <p class="home-tag">SANGDO × BLOCK WORLD</p>
      <img class="dd" src="dd-cutout.png" alt="">
    </section>
  </main>

  <main class="page picker" id="picker" aria-hidden="true">
    <section class="picker-wrap" aria-label="담당자 뽑기">
      <h1 class="picker-title">상도랑 마크 할 사람</h1>
      <p class="picker-subtitle">오늘의 운명은 블록이 정한다.</p>
      <div class="machine">
        <div class="screen" id="screen" aria-live="polite"><p class="idle" id="idle">? ? ?</p><p class="result" id="result"></p></div>
        <button class="pick" id="pick" type="button">뽑기!</button>
      </div>
      <p class="hint" id="hint">버튼을 누르면 결과가 나옵니다.</p>
      <button class="home-button" id="back" type="button">홈으로</button>
    </section>
  </main>

  <script>
    const outcomes = [{ name: '일병 성민준', limit: 0.5 }, { name: '성민준', limit: 0.75 }, { name: 'minjoon Seong', limit: 1 }];
    const home = document.querySelector('#home');
    const picker = document.querySelector('#picker');
    const start = document.querySelector('#start');
    const back = document.querySelector('#back');
    const button = document.querySelector('#pick');
    const screen = document.querySelector('#screen');
    const idle = document.querySelector('#idle');
    const result = document.querySelector('#result');
    const hint = document.querySelector('#hint');
    let picking = false;
    const mysteryFrames = ['? ? ?', '■ ? ■', '? ■ ?', '■ ■ ■'];

    function showPage(page) { home.classList.toggle('active', page === 'home'); picker.classList.toggle('active', page === 'picker'); picker.setAttribute('aria-hidden', String(page !== 'picker')); }
    function choose() { const roll = Math.random(); return outcomes.find(({ limit }) => roll < limit).name; }
    start.addEventListener('click', () => showPage('picker'));
    back.addEventListener('click', () => showPage('home'));
    button.addEventListener('click', () => {
      if (picking) return;
      picking = true; button.disabled = true; button.textContent = '뽑는 중...'; hint.textContent = '블록을 캐는 중...'; screen.classList.remove('show-result'); screen.classList.add('rolling');
      let frame = 0;
      const roulette = setInterval(() => { idle.textContent = mysteryFrames[frame++ % mysteryFrames.length]; }, 105);
      setTimeout(() => { clearInterval(roulette); result.textContent = choose(); screen.classList.remove('rolling'); screen.classList.add('show-result'); button.disabled = false; button.textContent = '다시 뽑기!'; hint.textContent = '오늘의 담당자가 정해졌습니다.'; picking = false; }, 1250);
    });
  </script>
</body>
</html>
